name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the manifest version is new
        id: version
        run: |
          tag="v$(node -p "require('./extension/manifest.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already released, nothing to do"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.released == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.version.outputs.released == 'true'
        run: npm test

      - name: Package
        if: steps.version.outputs.released == 'true'
        id: package
        run: |
          zip="twitch-2k-${{ steps.version.outputs.tag }}.zip"
          npm run package
          mv twitch-2k.zip "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ${{ steps.package.outputs.zip }}

      - name: Create tag and GitHub release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.zip }}" --target "$GITHUB_SHA" --generate-notes

  publish:
    needs: release
    # Runs only for a new version and once the Chrome Web Store is configured, see store/releasing.md.
    if: needs.release.outputs.released == 'true' && vars.CWS_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: extension

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome-web-store.mjs "${{ needs.release.outputs.zip }}"
